# PostgreSQL with one encrypted gp3 EBS volume. The volume lives in one AZ, so the pod always runs there.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: parklens
  labels:
    app.kubernetes.io/name: parklens
    app.kubernetes.io/component: db
spec:
  selector:
    app.kubernetes.io/name: parklens
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: parklens
  labels:
    app.kubernetes.io/name: parklens
    app.kubernetes.io/component: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parklens
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parklens
        app.kubernetes.io/component: db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # "postgres" in the alpine image
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: parklens
            - name: POSTGRES_USER
              value: parklens
            # Only used when the data directory is first initialised; see README.md before changing it
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parklens-env
                  key: POSTGRES_PASSWORD
            # Subdirectory, because the volume root contains lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          # Over TCP: during first-time init the entrypoint's temporary server only listens on the socket
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "parklens", "-d", "parklens"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "parklens", "-d", "parklens"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # SIGTERM is Postgres' "smart" shutdown, which waits for the API's pooled connections to close
            preStop:
              exec:
                command: ["pg_ctl", "stop", "-m", "fast"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
