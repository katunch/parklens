# Node API. The web pods reach it as http://api:3000 (hard-coded in web/nginx.conf), so the Service must be named "api".
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: parklens
  labels:
    app.kubernetes.io/name: parklens
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: parklens
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: parklens
  labels:
    app.kubernetes.io/name: parklens
    app.kubernetes.io/component: api
spec:
  # Exactly one replica: live updates (SSE) go through an in-process event bus, so a second pod's clients
  # would miss the first pod's events. Rollouts start the new pod before stopping the old one.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parklens
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parklens
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" in the image
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/katunch/parklens-api # tag set in kustomization.yaml
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: parklens-config
            - secretRef:
                name: parklens-env # JWT_SECRET, GATE_API_KEY, ADMIN_PASSWORD
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parklens-env
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://parklens:$(POSTGRES_PASSWORD)@db:5432/parklens
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 256Mi
          # Migrations and the demo seed run before the server listens
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 90
          # /api/health answers 503 while the database is unreachable
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          # TCP only, so a database outage doesn't restart the API as well
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
