# nginx serving the SPA and proxying /api (REST + SSE) to the API. These pods are the ALB targets.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: parklens
  labels:
    app.kubernetes.io/name: parklens
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: parklens
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: parklens
  labels:
    app.kubernetes.io/name: parklens
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: parklens
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parklens
        app.kubernetes.io/component: web
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across AZs so an AZ or node failure doesn't take the app down
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: parklens
              app.kubernetes.io/component: web
      containers:
        - name: web
          image: ghcr.io/katunch/parklens-web # tag set in kustomization.yaml
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 64Mi
          # /healthz is answered by nginx itself, independent of the API
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Keep serving while the ALB deregisters the pod during rollouts
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
---
# Auto Mode drains nodes for consolidation and replaces every node after
# 14 days; this keeps at least one replica running while that happens.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: parklens
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parklens
      app.kubernetes.io/component: web
