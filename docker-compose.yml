name: parklens

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parklens}
      POSTGRES_USER: ${POSTGRES_USER:-parklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parklens}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-parklens}:${POSTGRES_PASSWORD:-parklens}@db:5432/${POSTGRES_DB:-parklens}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GATE_API_KEY: ${GATE_API_KEY:-dev-gate-key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@parklens.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-parklens-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Parking Admin}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8088}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_FORMAT: ${WEBHOOK_FORMAT:-generic}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
